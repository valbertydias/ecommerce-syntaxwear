<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tênis e sneakers online na SyntaxWear. Encontre os últimos lançamentos, ofertas exclusivas e uma ampla seleção de calçados para todos os estilos. Compre agora e eleve seu estilo com a SyntaxWear!">

    <title>SyntaxWear - Tênis e Sneakers online</title>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components/header.css">
    <link rel="stylesheet" href="assets/css/components/hero.css">
    <link rel="stylesheet" href="assets/css/components/products-categories.css">
    <link rel="stylesheet" href="assets/css/components/products-grid.css">

</head>

<body>
    <header class="header">
        <h1 class="logo">
            <a href="#" title="SyntaxWear - Tênis e Sneakers online">
                <img src="./assets/images/logo/logo.svg" alt="Logo SyntaxWear">
            </a>
        </h1>

        <nav class="nav-center" aria-label="Categorias Principais">
            <ul>
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                <li><a href="#">Outlet</a></li>
            </ul>
        </nav>

        <nav class="nav-right" aria-label="Menu Secundário">
            <ul>
                <li><a href="#">Nossas lojas</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#" aria-label="Minha Conta"><img src="./assets/images/icons/user.svg" alt="Ícone Usuário"
                            class="icon-user"></a></li>
                <li><a href="#" aria-label="Ajuda"><img src="./assets/images/icons/help.svg" alt="Ícone Ajuda"
                            class="icon-help"></a></li>
                <li><a href="#" aria-label="Carrinho"><img src="./assets/images/icons/bag.svg" alt="Ícone Carrinho"
                            class="icon-bag"></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-subtitle">Krypton One</span>
                    <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
                    <div class="hero-buttons">
                        <a href="#" class="btn btn-outline">Ver modelos</a>
                        <a href="#" class="btn btn-filled">Comprar</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="categories-section">  
                <div class="category-card casual">
                    <a href="#" class="category-link">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Casual</span>
                    </a>
                </div>
               
                <div class="category-card sport">
                    <a href="#" class="category-link">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Esporte</span>
                    </a>
                </div>
                     
                <div class="category-card modern">
                    <a href="#" class="category-link ">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Moderno</span>
                    </a>
                </div>
             
                <div class="category-card futuristic">
                    <a href="#" class="category-link ">
                        <span class="overlay"></span>
                        <span class="category-name btn btn-outline">Futurista</span>
                    </a>
                </div>
        </section>

        <section class="grid-section">
            
            <div class="card top1">
                <div class="top1-content">
                    <h3 class="card-title">Krypton One</h3>
                    <p class="card-subtitle">Estilo Urbano com atitude</p>
                    <div class="cta-group">
                        <a href="#" class="btn btn-outline">Feminino</a>
                        <a href="#" class="btn btn-outline">Masculino</a>
                    </div>
                </div>
            </div>
            <div class="card top2"></div>
            <div class="card midL"></div>
            <div class="card midR"></div>
            <div class="card bottomL"></div>
            <div class="card bottomR"></div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-contact">
            </div>
            <div class="footer-links">
            </div>
        </div>
    </footer>
</body>

</html>
